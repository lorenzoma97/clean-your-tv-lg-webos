name: Salotto installer (fork lorenzoma97)

# The Windows graphical installer with this fork's Home (the Casa layer) as its payload, for the owner's C3.
# Only a workflow artifact: no release, so the original project's release workflows never see it.
on:
  workflow_dispatch:
  push:
    branches: [salotto]
    paths: ["launcher/**", ".github/workflows/salotto-installer.yml"]

permissions:
  contents: read

concurrency:
  group: salotto-installer
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r cytv/build-requirements.txt
      - run: python scripts/build-cytv.py --desktop
      - name: Check the embedded payload
        shell: pwsh
        timeout-minutes: 3
        run: |
          $destination = Join-Path $env:RUNNER_TEMP 'salotto'
          Expand-Archive -LiteralPath dist/cytv-windows-x64-desktop.zip -DestinationPath $destination
          $env:QT_QPA_PLATFORM = 'offscreen'
          $process = Start-Process -FilePath (Join-Path $destination 'cytv-desktop/cytv-desktop.exe') -ArgumentList '--check-payload' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "payload check failed: $($process.ExitCode)" }
      - uses: actions/upload-artifact@v4
        with:
          name: salotto-installer-windows
          path: dist/cytv-windows-x64-desktop.zip
          if-no-files-found: error
